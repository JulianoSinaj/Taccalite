name: Build and push image

# WHY: taccalite is the slowest build on the Hetzner host - 314s average, vs 89-243s
# for everything else - and it is a Next.js build, the 1.5-3 GB class. It is also the
# app whose build exhausted host memory on 2026-08-24 and got an unrelated project's
# MySQL killed 9 times by the kernel OOM killer. Building here costs the server nothing.
#
# TRIGGER IS MANUAL FOR NOW. Coolify still builds this app from source on every push.
# Adding `on: push` before Coolify is switched to the Docker Image build pack would
# build each commit twice and publish an image nothing pulls - the waste that got the
# autolux-auto pilot disabled on 2026-08-26. Flip it once Coolify pulls this image.

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic, no setup needed

      # GHCR requires a lowercase path; the repo is JulianoSinaj/Taccalite.
      - name: Compute image name
        id: img
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Inlined into the client bundle at build time. Coolify injects this as an ARG
          # when it builds; CI has to pass it explicitly or the built app silently loses
          # its own URL. The default reproduces what the server currently runs, so the
          # migration is behaviourally a no-op. Verified by counting occurrences in
          # /app/.next: a correct image has 14.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://taccalite.testdemo.it' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo '### taccalite' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
