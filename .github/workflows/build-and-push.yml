name: Build and push image

# WHY: taccalite is the slowest build on the Hetzner host - 314s average, vs 89-243s
# for everything else - and it is a Next.js build, the 1.5-3 GB class. It is also the
# app whose build exhausted host memory on 2026-08-24 and got an unrelated project's
# MySQL killed 9 times by the kernel OOM killer. Building here costs the server nothing.
#
# Coolify is on the Docker Image build pack for this app and pulls
# ghcr.io/julianosinaj/taccalite:latest, so this workflow is the only thing producing a
# deployable artifact and the deploy job below is what ships it. Coolify auto-deploy is
# OFF here on purpose: with it on, its webhook fires the instant you push and pulls the
# PREVIOUS :latest, because this build has not finished yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic, no setup needed

      # GHCR requires a lowercase path; the repo is JulianoSinaj/Taccalite.
      - name: Compute image name
        id: img
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Inlined into the client bundle at build time. Coolify injects this as an ARG
          # when it builds; CI has to pass it explicitly or the built app silently loses
          # its own URL. The default reproduces what the server currently runs, so the
          # migration is behaviourally a no-op. Verified by counting occurrences in
          # /app/.next: a correct image has 14.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://taccalite.testdemo.it' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo '### taccalite' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- deploy
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        # Secrets are read via env and tested in the shell, never in a step-level `if:`.
        # The secrets context is not allowed there and using it makes the whole workflow
        # file invalid - every run fails in 0s. Do not "tidy" this into an if:.
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL || 'https://coolify.testdemo.it' }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID || 'x2e39se3vrnh7ckodhetmn9p' }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::COOLIFY_TOKEN not set - the image is published but nothing deployed it. Click Deploy on taccalite in Coolify, or add the secret to make this automatic."
            exit 0
          fi
          echo "Triggering deploy of $COOLIFY_APP_UUID at $COOLIFY_URL"
          curl -fsSL -X GET -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false"
          echo "Deploy requested."
